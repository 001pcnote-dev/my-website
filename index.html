<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <title>SmartDiary</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet"/>

    <style>
        body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 4rem); }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .prose img { max-height: 200px; object-fit: cover; border-radius: 0.5rem; width: 100%; cursor: zoom-in; }
        /* スムーズなFLIPアニメーション用 */
        .diary-card { will-change: transform, box-shadow; transition: box-shadow 0.3s ease; }
        
        /* 追加: 期間フィルタタブとエクスポート用チェックボックスのスタイル */
        .period-tab { transition: all 0.2s; border-bottom: 2px solid transparent; }
        .period-tab.active { border-bottom-color: #6366f1; color: #6366f1; font-weight: 700; }
        .export-checkbox {
            appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #cbd5e1; border-radius: 0.375rem;
            background-color: white; cursor: pointer; transition: all 0.2s;
        }
        .export-checkbox:checked { background-color: #6366f1; border-color: #6366f1; }
        .export-checkbox:checked::after {
            content: '✔'; color: white; font-size: 0.875rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        
        /* 追加: 印刷（PDF）時の不要UI非表示設定 */
        @media print {
            body { background: white !important; }
            .no-print, header, #search-filter-area, #settings-modal, #editor-modal, #lightbox-modal, button.fixed { display: none !important; }
            #diary-container { display: block; }
            .diary-card { break-inside: avoid; page-break-inside: avoid; box-shadow: none !important; border: 1px solid #e2e8f0; margin-bottom: 20px; }
            .sort-buttons-container, .export-checkbox-container { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col select-none relative">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-30 safe-top transition-all duration-300 no-print">
        <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-white shadow-md shadow-indigo-100">
                    <i class="fa-solid fa-book-open text-sm"></i>
                </div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent">SmartDiary</h1>
            </div>
            <div class="flex items-center space-x-1">
                <button onclick="manualSave()" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition-colors" title="今すぐデータを保存">
                    <i class="fa-solid fa-floppy-disk text-lg"></i>
                </button>
                <button id="folder-sync-btn" onclick="initFolderAccess()" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition-colors relative group" title="保存先フォルダを同期">
                    <i id="sync-icon" class="fa-solid fa-folder-open text-lg"></i>
                    <span id="sync-status-dot" class="absolute top-2 right-2 w-2 h-2 bg-rose-500 rounded-full border border-white"></span>
                </button>
                <button onclick="toggleSettings()" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-50 rounded-xl transition-colors" title="設定・出力">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 safe-bottom">
        
        <div id="search-filter-area" class="no-print">
            <div class="flex space-x-5 mb-3 px-1 text-[11px] tracking-wider uppercase text-slate-400">
                <button onclick="setPeriodFilter('ALL')" id="tab-ALL" class="period-tab active">ALL</button>
                <button onclick="setPeriodFilter('MONTHLY')" id="tab-MONTHLY" class="period-tab">MONTHLY</button>
                <button onclick="setPeriodFilter('WEEKLY')" id="tab-WEEKLY" class="period-tab">WEEKLY</button>
                <button onclick="setPeriodFilter('DAILY')" id="tab-DAILY" class="period-tab">DAILY</button>
            </div>

            <div class="mb-6 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-3">
                <div class="flex-1 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="search" id="search-input" placeholder="日記を検索... (画像・動画でも絞り込み可)" class="w-full pl-9 pr-4 py-2 bg-slate-50 border-0 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 text-slate-700 placeholder-slate-400 transition-all" oninput="filterDiaryItems()"/>
                </div>
                <select id="tag-filter" onchange="filterDiaryItems()" class="bg-slate-50 border-0 text-sm rounded-xl py-2 pl-3 pr-8 text-slate-600 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 cursor-pointer">
                    <option value="">すべてのタグ</option>
                </select>
            </div>
        </div>

        <div id="diary-container" class="space-y-4 relative">
            </div>

        <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400 mb-4">
                <i class="fa-solid fa-pen-fancy text-2xl"></i>
            </div>
            <p class="text-slate-500 text-sm font-medium">日記がまだありません</p>
            <p class="text-slate-400 text-xs mt-1">右下のボタンから最初の日記を書きましょう</p>
        </div>
    </main>

    <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-gradient-to-tr from-indigo-500 to-purple-500 text-white rounded-full shadow-lg shadow-indigo-200 flex items-center justify-center text-xl hover:scale-105 active:scale-95 transition-all z-40 focus:outline-none no-print">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4 no-print" onclick="toggleSettings()">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-800">エクスポート出力</h3>
                <button onclick="toggleSettings()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:bg-slate-50 rounded-full transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-100">
                <i class="fa-solid fa-circle-info text-indigo-400 mr-1"></i>
                カードのチェックボックスを選択すると、その項目のみ出力されます。未選択の場合は、現在の期間フィルタ（<span id="settings-filter-label" class="font-bold text-indigo-600">ALL</span>）のすべてのデータが出力されます。

                <button onclick="exportData('json')" class="w-full flex items-center justify-between p-3 border border-slate-200 hover:border-indigo-300 rounded-xl hover:bg-indigo-50 transition-colors text-sm font-medium text-slate-700">

                    <span><i class="fa-brands fa-markdown text-indigo-500 mr-2"></i> Markdown (連携用)</span><i class="fa-solid fa-download text-slate-400"></i>
                </button>
                <button onclick="exportPDF()" class="w-full flex items-center justify-between p-3 border border-slate-200 hover:border-indigo-300 rounded-xl hover:bg-indigo-50 transition-colors text-sm font-medium text-slate-700">
                    <span><i class="fa-regular fa-file-pdf text-indigo-500 mr-2"></i> PDF (印刷レイアウト)</span><i class="fa-solid fa-print text-slate-400"></i>
                </button>

    <div id="editor-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center p-0 sm:p-4 no-print" onclick="closeModal()">
        <div class="bg-white w-full sm:max-w-2xl rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[92vh] sm:max-h-[85vh] transform translate-y-full sm:translate-y-0 sm:scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between shrink-0">
                <h3 id="modal-title" class="text-base font-bold text-slate-800">日記を書く</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:bg-slate-50 rounded-full transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-5 no-scrollbar">
                <input type="hidden" id="entry-id"/>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">日付</label>
                        <input type="date" id="entry-date" class="w-full px-3 py-2 bg-slate-50 border border-slate-100 rounded-xl text-sm focus:outline-none focus:border-indigo-500 font-medium text-slate-700"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">天気</label>
                        <div class="flex bg-slate-50 border border-slate-100 rounded-xl p-1 justify-between items-center">
                            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-lg transition-all text-slate-400 has-[:checked]:bg-white has-[:checked]:text-amber-500 has-[:checked]:shadow-sm">
                                <input type="radio" name="weather" value="sunny" class="hidden"/>
                                <i class="fa-solid fa-sun text-base"></i>
                            </label>
                            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-lg transition-all text-slate-400 has-[:checked]:bg-white has-[:checked]:text-blue-400 has-[:checked]:shadow-sm">
                                <input type="radio" name="weather" value="cloudy" class="hidden"/>
                                <i class="fa-solid fa-cloud text-base"></i>
                            </label>
                            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-lg transition-all text-slate-400 has-[:checked]:bg-white has-[:checked]:text-indigo-400 has-[:checked]:shadow-sm">
                                <input type="radio" name="weather" value="rainy" class="hidden"/>
                                <i class="fa-solid fa-cloud-showers-heavy text-base"></i>
                            </label>
                            <label class="flex-1 text-center cursor-pointer py-1.5 rounded-lg transition-all text-slate-400 has-[:checked]:bg-white has-[:checked]:text-slate-400 has-[:checked]:shadow-sm">
                                <input type="radio" name="weather" value="snowy" class="hidden"/>
                                <i class="fa-solid fa-snowflake text-base"></i>
                            </label>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">内容 (Markdown対応)</label>
                    <textarea id="entry-content" rows="8" placeholder="今日の内容を書きましょう..." class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-700 placeholder-slate-400 leading-relaxed resize-none"></textarea>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">メディア</label>

                        <p class="text-[10px] text-slate-400 mt-1">表示用は圧縮され、原本は originals フォルダに直接保存されます</p>
                    </div>

    <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-50 hidden opacity-0 transition-opacity duration-300 flex flex-col no-print" onclick="closeLightbox()">
        <div class="h-14 flex items-center justify-between px-4 text-white z-10 shrink-0 bg-gradient-to-b from-black/50 to-transparent">
            <span id="lightbox-caption" class="text-sm font-medium truncate max-w-[70%]"></span>
            <div class="flex items-center space-x-4">
                <button id="zoom-indicator" onclick="toggleImageZoom(event)" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full backdrop-blur-sm transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-magnifying-glass-plus"></i> フィット
                </button>
                <button onclick="closeLightbox()" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>
        <div id="lightbox-scroll-container" class="flex-1 overflow-auto flex items-center justify-center p-4 no-scrollbar">
            <img id="lightbox-img" src="" alt="Zoomed view" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform cursor-zoom-in" onclick="toggleImageZoom(event)"/>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur text-white text-sm px-5 py-2.5 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center gap-2 no-print">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-text" class="font-medium">完了</span>
    </div>

　　<script>
        let dirHandle = null;
        let diaryItems = [];
        let currentMediaFile = null;
        
        // 期間フィルタと設定モーダルの状態
        let currentPeriodFilter = 'ALL';
        let isSettingsOpen = false;

        const weatherConfig = {
            sunny: { icon: 'fa-sun', color: 'text-amber-500', label: '晴れ' },
            cloudy: { icon: 'fa-cloud', color: 'text-blue-400', label: '曇り' },
            rainy: { icon: 'fa-cloud-showers-heavy', color: 'text-indigo-400', label: '雨' },
            snowy: { icon: 'fa-snowflake', color: 'text-slate-400', label: '雪' }
        };

        // --- 初期化 ---
        document.addEventListener('DOMContentLoaded', () => {
            loadDiaryFromLocalStorage();

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeLightbox();
                    closeModal();
                    if(isSettingsOpen) toggleSettings();
                }
            });
        });

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2500);
        }

        // --- 保存・同期ロジック ---
        let saveTimeout = null;
        function saveLocally() {
            const dataStr = JSON.stringify(diaryItems, null, 2);
            localStorage.setItem('smart_diary_backup', dataStr);
            debouncedSave();
        }

        function debouncedSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveDiaryToFolder();
            }, 1500);
        }

        async function manualSave() {
            clearTimeout(saveTimeout);
            await saveDiaryToFolder();
            showToast("手動保存しました");
        }

        async function saveDiaryToFolder() {
            if (!dirHandle) return;
            try {
                const dataStr = JSON.stringify(diaryItems, null, 2);
                const fileHandle = await dirHandle.getFileHandle('diary_data.json', { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(dataStr);
                await writable.close();
            } catch (e) {
                console.error("Failed to sync automatically to local folder", e);
            }
        }

        function loadDiaryFromLocalStorage() {
            const localData = localStorage.getItem('smart_diary_backup');
            if (localData) {
                try {
                    diaryItems = JSON.parse(localData);
                    renderDiaryItems();
                    updateTagFilterOptions();
                } catch (e) { console.error("Local storage load error", e); }
            } else {
                updateEmptyState();
            }
        }

        async function initFolderAccess() {
            try {
                dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                document.getElementById('sync-status-dot').className = "absolute top-2 right-2 w-2 h-2 bg-emerald-500 rounded-full border border-white";
                
                await dirHandle.getDirectoryHandle('originals', { create: true });

                await loadDiaryFromFolder();
                showToast("フォルダと同期しました");
            } catch (err) {
                console.error("Directory access denied or failed", err);
                if (err.name !== 'AbortError') alert("フォルダへのアクセスが拒否されました。");
            }
        }

        async function loadDiaryFromFolder() {
            if (!dirHandle) return;
            try {
                const fileHandle = await dirHandle.getFileHandle('diary_data.json', { create: true });
                const file = await fileHandle.getFile();
                const text = await file.text();
                if (text.trim().length > 0) {
                    diaryItems = JSON.parse(text);
                    localStorage.setItem('smart_diary_backup', text);
                    renderDiaryItems();
                    updateTagFilterOptions();
                } else {
                    updateEmptyState();
                }
            } catch (e) { console.error("Error reading data from local folder", e); }
        }

        function updateEmptyState() {
            const container = document.getElementById('diary-container');
            const emptyState = document.getElementById('empty-state');
            if (container.children.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                container.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }
        }

        // --- 画像圧縮処理 (Canvas) ---
        function compressImage(file, maxSize = 1200) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxSize) { height = Math.round(height * maxSize / width); width = maxSize; }
                        } else {
                            if (height > maxSize) { width = Math.round(width * maxSize / height); height = maxSize; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL(file.type, 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // --- オリジナルファイルを開く処理 ---
        async function openOriginal(fileName) {
            if (!dirHandle) { alert("オリジナルファイルを開くには、上部のフォルダアイコンから保存先を同期してください。"); return; }
            try {
                const originalDir = await dirHandle.getDirectoryHandle('originals');
                const fileHandle = await originalDir.getFileHandle(fileName);
                const file = await fileHandle.getFile();
                const url = URL.createObjectURL(file);
                window.open(url, '_blank');
            } catch (e) { alert("オリジナルファイルが見つからないか、読み込めませんでした。"); }
        }

// --- 描画・UI処理（余白・はみ出し完全修正版） ---
        function renderDiaryItems(itemsToRender = diaryItems) {
            const container = document.getElementById('diary-container');
            container.innerHTML = '';
            
            if (itemsToRender.length === 0) {
                updateEmptyState();
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('flex');
            container.classList.remove('hidden');
            
            const isSearching = document.getElementById('search-input').value.trim() !== '' || document.getElementById('tag-filter').value !== '';
            
            itemsToRender.forEach((item) => {
                const weatherObj = weatherConfig[item.weather] || null;
                const weatherIconHtml = weatherObj ? `<i class="fa-solid ${weatherObj.icon} ${weatherObj.color} text-sm" title="${weatherObj.label}"></i>` : '';
                
                let mediaHtml = '';
                if (item.media && item.media.data) {
                    let originalBtn = item.media.originalName ? `<button onclick="event.stopPropagation(); openOriginal('${item.media.originalName}')" class="absolute bottom-2 right-2 bg-black/40 hover:bg-black/60 text-white/90 backdrop-blur-md rounded-lg px-2 py-1 text-[10px] font-bold tracking-wide transition-all z-10 flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-arrow-up-right-from-square"></i> Original</button>` : '';

                    if (item.media.type.startsWith('image/')) {
                        mediaHtml = `<div class="mt-3 overflow-hidden rounded-xl border border-slate-100 max-h-60 bg-slate-50 flex items-center justify-center relative">
                                        <img src="${item.media.data}" alt="Diary Media" class="w-full h-full object-cover cursor-zoom-in hover:scale-[1.02] transition-transform duration-300" onclick="openLightbox('${item.media.data}', '${item.date}')"/>
                                        ${originalBtn}
                                     </div>`;
                    } else if (item.media.type.startsWith('video/')) {
                        mediaHtml = `<div class="mt-3 overflow-hidden rounded-xl border border-slate-100 max-h-60 bg-slate-50 flex items-center justify-center relative">
                                        <video src="${item.media.data}" controls class="w-full max-h-60 object-contain bg-black"></video>
                                        ${originalBtn}
                                     </div>`;
                    }
                }

                let tagsHtml = '';
                if (item.tags && item.tags.length > 0) {
                    tagsHtml = `<div class="flex flex-wrap gap-1.5 mt-3">
                        ${item.tags.map(tag => `<span class="bg-slate-50 text-slate-500 border border-slate-100 text-[11px] px-2 py-0.5 rounded-md font-medium">#${DOMPurify.sanitize(tag)}</span>`).join('')}
                    </div>`;
                }

                const dateObj = new Date(item.date);
                const formattedDate = dateObj.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

                const card = document.createElement('div');
                // 余白削減：p-4 から p-3.5 にし、カード自体の無駄な隙間を凝縮
                card.className = "diary-card bg-white border border-slate-100 p-3.5 rounded-2xl shadow-sm hover:shadow-md relative group";
                card.setAttribute('data-id', item.id);
                
                const isFixed = item.fixed || false;
                let sortButtonsHTML = '';
                
                if (!isSearching) {
                    sortButtonsHTML = `
                        <button onclick="toggleFixed('${item.id}')" class="w-7 h-7 flex items-center justify-center ${isFixed ? 'text-indigo-600' : 'text-slate-300 hover:text-slate-500'} rounded-lg transition-colors" title="固定/解除">
                            <i class="fa-solid fa-thumbtack ${isFixed ? '' : '-rotate-45'} text-xs"></i>
                        </button>
                        <button onclick="moveItem('${item.id}', -1)" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="上に移動"><i class="fa-solid fa-arrow-up text-xs"></i></button>
                        <button onclick="moveItem('${item.id}', 1)" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="下に移動"><i class="fa-solid fa-arrow-down text-xs"></i></button>
                        <div class="w-px h-4 bg-slate-200 mx-1"></div>
                    `;
                }

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-2 mb-2.5 gap-2">
                        
                        <div class="flex items-center justify-between sm:justify-start sm:space-x-2.5 min-w-0 w-full sm:w-auto">
                            <div class="flex items-center space-x-2 min-w-0">
                                <span class="text-sm font-bold text-slate-700 tracking-tight whitespace-nowrap">${formattedDate}</span>
                                <div class="flex-shrink-0">${weatherIconHtml}</div>
                            </div>
                            <div class="export-checkbox-container no-print sm:hidden flex items-center">
                                <input type="checkbox" class="export-checkbox entry-checkbox w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" value="${item.id}">
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-between sm:justify-end space-x-3 w-full sm:w-auto">
                            <div class="sort-buttons-container flex items-center space-x-0.5 sm:opacity-0 group-hover:opacity-100 transition-opacity duration-200 ml-auto sm:ml-0">
                                ${sortButtonsHTML}
                                <button onclick="openModal('${item.id}')" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="編集"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteDiaryItem('${item.id}')" class="w-7 h-7 flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="削除"><i class="fa-solid fa-trash-can text-xs"></i></button>
                            </div>

                            <div class="export-checkbox-container hidden sm:flex items-center no-print border-l border-slate-200 pl-3 h-5">
                                <input type="checkbox" class="export-checkbox entry-checkbox w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300" value="${item.id}">
                            </div>
                        </div>

                    </div>
                    
                    <div class="prose prose-slate prose-sm max-w-none text-slate-600 font-normal leading-relaxed break-words select-text">
                        ${DOMPurify.sanitize(marked.parse(item.content || ''))}
                    </div>
                    ${mediaHtml}
                    ${tagsHtml}
                `;
                container.appendChild(card);
            });
            updateEmptyState();
        }

        // --- 指の下に固定されるヌルヌルFLIPアニメーション ---
        function toggleFixed(id) {
            const item = diaryItems.find(i => i.id === id);
            if (item) {
                item.fixed = !item.fixed;
                filterDiaryItems();
                saveLocally();
                showToast(item.fixed ? "アイテムを固定しました" : "固定を解除しました");
            }
        }

        function moveItem(id, direction) {
            const isSearching = document.getElementById('search-input').value.trim() !== '' || document.getElementById('tag-filter').value !== '';
            if (isSearching) {
                alert("テキスト・タグでの検索絞り込み中は並び替えできません。");
                return;
            }

            const idx = diaryItems.findIndex(i => i.id === id);
            if (idx === -1) return;
            if (diaryItems[idx].fixed) { showToast("このアイテムは固定されています"); return; }

            const fixedPositions = [];
            const nonFixedItems = [];
            diaryItems.forEach((item, index) => {
                if (item.fixed) fixedPositions.push({ index, item });
                else nonFixedItems.push(item);
            });
            const nonFixedIdx = nonFixedItems.findIndex(i => i.id === id);
            const newNonFixedIdx = nonFixedIdx + direction;
            if (newNonFixedIdx < 0 || newNonFixedIdx >= nonFixedItems.length) return;
            const temp = nonFixedItems[nonFixedIdx];
            nonFixedItems.splice(nonFixedIdx, 1);
            nonFixedItems.splice(newNonFixedIdx, 0, temp);

            const newDiaryItems = new Array(diaryItems.length);
            fixedPositions.forEach(p => newDiaryItems[p.index] = p.item);
            let ptr = 0;
            for (let i = 0; i < newDiaryItems.length; i++) {
                if (!newDiaryItems[i]) newDiaryItems[i] = nonFixedItems[ptr++];
            }

            const container = document.getElementById('diary-container');
            const firstTops = {};
            container.querySelectorAll('.diary-card').forEach(card => {
                firstTops[card.getAttribute('data-id')] = card.getBoundingClientRect().top;
            });
            
            diaryItems = newDiaryItems;
            filterDiaryItems();
            saveLocally();
            
            const lastTops = {};
            container.querySelectorAll('.diary-card').forEach(card => {
                lastTops[card.getAttribute('data-id')] = card.getBoundingClientRect().top;
            });
            const targetDeltaY = firstTops[id] - lastTops[id];
            window.scrollBy(0, -targetDeltaY);

            const postScrollTops = {};
            container.querySelectorAll('.diary-card').forEach(card => {
                postScrollTops[card.getAttribute('data-id')] = card.getBoundingClientRect().top;
            });
            const movedCard = container.querySelector(`.diary-card[data-id="${id}"]`);
            if (movedCard) {
                movedCard.classList.add('z-30', 'scale-[1.02]', 'shadow-2xl', 'ring-2', 'ring-indigo-400');
                if (movedCard.dataset.timeoutId) clearTimeout(parseInt(movedCard.dataset.timeoutId));
                movedCard.dataset.timeoutId = setTimeout(() => {
                    movedCard.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s, transform 0.4s';
                    movedCard.classList.remove('scale-[1.02]', 'shadow-2xl', 'ring-2', 'ring-indigo-400');
                    setTimeout(() => movedCard.classList.remove('z-30'), 400);
                }, 400);
            }

            container.querySelectorAll('.diary-card').forEach(card => {
                const cid = card.getAttribute('data-id');
                const firstY = firstTops[cid];
                const currentY = postScrollTops[cid];
                if (firstY !== undefined && currentY !== undefined) {
                    const deltaY = firstY - currentY;
                    if (deltaY !== 0) {
                        card.style.transform = `translateY(${deltaY}px)`;
                        card.style.transition = 'none';
                    }
                }
            });
            requestAnimationFrame(() => {
                container.querySelectorAll('.diary-card').forEach(card => {
                    card.getBoundingClientRect();
                    card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    card.style.transform = '';
                });
            });
        }

        // --- 期間フィルタ制御 ---
        function setPeriodFilter(period) {
            currentPeriodFilter = period;
            document.querySelectorAll('.period-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(`tab-${period}`).classList.add('active');
            filterDiaryItems();
        }

        // --- 検索・フィルター処理 ---
        function updateTagFilterOptions() {
            const filterSelect = document.getElementById('tag-filter');
            if (!filterSelect) return;
            const previousValue = filterSelect.value;
            const allTags = new Set();
            diaryItems.forEach(item => { if (item.tags) item.tags.forEach(t => allTags.add(t)); });
            filterSelect.innerHTML = '<option value="">すべてのタグ</option>';
            Array.from(allTags).sort().forEach(tag => {
                const opt = document.createElement('option');
                opt.value = tag; opt.textContent = `#${tag}`;
                filterSelect.appendChild(opt);
            });
            filterSelect.value = previousValue;
        }

        function filterDiaryItems() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const tagFilter = document.getElementById('tag-filter').value;
            const now = new Date();

            const filtered = diaryItems.filter(item => {
                let matchesQuery = false;
                if (query === '画像' || query === 'image') {
                    matchesQuery = item.media && item.media.type.startsWith('image/');
                } else if (query === '動画' || query === 'video') {
                    matchesQuery = item.media && item.media.type.startsWith('video/');
                } else {
                    const contentStr = (item.content || '').toLowerCase();
                    const dateStr = (item.date || '').toLowerCase();
                    const tagsStr = item.tags ? item.tags.join(' ').toLowerCase() : '';
                    matchesQuery = contentStr.includes(query) || dateStr.includes(query) || tagsStr.includes(query);
                }
                
                const matchesTag = tagFilter === "" || (item.tags && item.tags.includes(tagFilter));

                // 期間フィルタ
                let matchesPeriod = true;
                if (currentPeriodFilter !== 'ALL') {
                    const itemDate = new Date(item.date);
                    const diffTime = Math.abs(now - itemDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    if (currentPeriodFilter === 'DAILY') matchesPeriod = diffDays <= 1;
                    else if (currentPeriodFilter === 'WEEKLY') matchesPeriod = diffDays <= 7;
                    else if (currentPeriodFilter === 'MONTHLY') matchesPeriod = diffDays <= 31;
                }

                return matchesQuery && matchesTag && matchesPeriod;
            });
            renderDiaryItems(filtered);
        }

        // --- モーダル・ファイルアップロード処理 ---
        function openModal(id = null) {
            const modal = document.getElementById('editor-modal');
            const inner = modal.querySelector('.transform');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.add('opacity-100'); inner.classList.remove('translate-y-full', 'sm:scale-95'); }, 10);
            
            document.getElementById('entry-id').value = '';
            
            // ⭐ 【修正のポイント】新規作成のとき、タイムゾーンを考慮した今日の日付を確実に入力します
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('entry-date').value = `${yyyy}-${mm}-${dd}`;

            document.getElementById('entry-content').value = '';
            document.getElementById('entry-tags').value = '';
            currentMediaFile = null;
            document.getElementById('media-preview-container').innerHTML = '';
            document.getElementById('media-preview-container').classList.add('hidden');
            document.querySelectorAll('input[name="weather"]').forEach(radio => radio.checked = false);

            if (id) {
                document.getElementById('modal-title').textContent = "日記を編集";
                const item = diaryItems.find(i => i.id === id);
                if (item) {
                    document.getElementById('entry-id').value = item.id;
                    document.getElementById('entry-date').value = item.date;
                    document.getElementById('entry-content').value = item.content;
                    document.getElementById('entry-tags').value = item.tags ? item.tags.join(', ') : '';
                    if (item.weather) {
                        const targetRadio = document.querySelector(`input[name="weather"][value="${item.weather}"]`);
                        if (targetRadio) targetRadio.checked = true;
                    }
                    if (item.media && item.media.data) {
                        currentMediaFile = item.media;
                        displayMediaPreview(item.media.data, item.media.type);
                    }
                }
            } else {
                document.getElementById('modal-title').textContent = "日記を書く";
            }
        }

        function closeModal() {
            const modal = document.getElementById('editor-modal');
            const inner = modal.querySelector('.transform');
            modal.classList.remove('opacity-100');
            inner.classList.add('translate-y-full');
            if (window.innerWidth >= 640) inner.classList.add('sm:scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        async function handleMediaSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            let displayData = null;
            const previewContainer = document.getElementById('media-preview-container');
            previewContainer.innerHTML = '<div class="text-xs text-slate-400">処理中...</div>';
            previewContainer.classList.remove('hidden');

            if (file.type.startsWith('image/')) {
                displayData = await compressImage(file, 1200);
            } else {
                displayData = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            if (dirHandle) {
                try {
                    const originalsFolder = await dirHandle.getDirectoryHandle('originals', { create: true });
                    const uniqueName = Date.now() + '_' + file.name;
                    const fileHandle = await originalsFolder.getFileHandle(uniqueName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(file);
                    await writable.close();

                    currentMediaFile = { type: file.type, data: displayData, originalName: uniqueName };
                } catch (err) {
                    console.error("Failed to write original media", err);
                    currentMediaFile = { type: file.type, data: displayData };
                }
            } else {
                currentMediaFile = { type: file.type, data: displayData };
            }
            displayMediaPreview(displayData, file.type);
        }

        function displayMediaPreview(src, type) {
            const previewContainer = document.getElementById('media-preview-container');
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('hidden');
            const wrapper = document.createElement('div');
            wrapper.className = "relative rounded-xl overflow-hidden border border-slate-200 aspect-square bg-slate-100 flex items-center justify-center";
            if (type.startsWith('image/')) {
                wrapper.innerHTML = `<img src="${src}" class="w-full h-full object-cover"/>`;
            } else if (type.startsWith('video/')) {
                wrapper.innerHTML = `<video src="${src}" class="w-full h-full object-cover" muted playsinline></video><i class="fa-solid fa-play absolute text-white text-lg drop-shadow-md"></i>`;
            }
            const removeBtn = document.createElement('button');
            removeBtn.className = "absolute top-1 right-1 w-6 h-6 bg-black/60 hover:bg-black/80 rounded-full text-white flex items-center justify-center text-xs transition-colors";
            removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            removeBtn.onclick = (e) => { e.stopPropagation(); currentMediaFile = null; previewContainer.innerHTML = ''; previewContainer.classList.add('hidden'); };
            wrapper.appendChild(removeBtn);
            previewContainer.appendChild(wrapper);
        }

        async function saveDiaryItem() {
            const id = document.getElementById('entry-id').value;
            const date = document.getElementById('entry-date').value;
            const content = document.getElementById('entry-content').value.trim();
            const tagsRaw = document.getElementById('entry-tags').value;
            
            const selectedWeatherRadio = document.querySelector('input[name="weather"]:checked');
            const weather = selectedWeatherRadio ? selectedWeatherRadio.value : '';

            if (!content && !currentMediaFile) { alert("日記の内容またはメディアを入力してください。"); return; }

            const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
            
            if (id) {
                const idx = diaryItems.findIndex(item => item.id === id);
                if (idx !== -1) {
                    diaryItems[idx].date = date;
                    diaryItems[idx].weather = weather;
                    diaryItems[idx].content = content;
                    diaryItems[idx].tags = tags;
                    diaryItems[idx].media = currentMediaFile;
                }
            } else {
                const newItem = {
                    id: Date.now().toString(),
                    date,
                    weather,
                    content,
                    tags,
                    media: currentMediaFile,
                    fixed: false
                };
                diaryItems.unshift(newItem);
            }

            if (selectedWeatherRadio) selectedWeatherRadio.checked = false;
            filterDiaryItems();
            updateTagFilterOptions();
            closeModal();
            saveLocally();
        }

        function deleteDiaryItem(id) {
            if (!confirm("この日記を完全に削除してもよろしいですか？")) return;
            diaryItems = diaryItems.filter(item => item.id !== id);
            filterDiaryItems();
            updateTagFilterOptions();
            saveLocally();
        }

        // --- ライトボックス (画像拡大) ---
        function openLightbox(src, title) {
            const lightbox = document.getElementById('lightbox-modal');
            const img = document.getElementById('lightbox-img');
            document.getElementById('lightbox-caption').textContent = new Date(title).toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
            img.src = src;
            isOriginalSize = false;
            img.className = "max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform cursor-zoom-in";
            document.getElementById('lightbox-scroll-container').classList.add('items-center', 'justify-center');
            document.getElementById('zoom-indicator').innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> フィット';

            lightbox.classList.remove('hidden');
            setTimeout(() => lightbox.classList.add('opacity-100'), 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox-modal');
            lightbox.classList.remove('opacity-100');
            setTimeout(() => lightbox.classList.add('hidden'), 300);
        }

        let isOriginalSize = false;
        function toggleImageZoom(event) {
            event.stopPropagation();
            const img = document.getElementById('lightbox-img');
            const container = document.getElementById('lightbox-scroll-container');
            const indicator = document.getElementById('zoom-indicator');
            if (!isOriginalSize) {
                img.className = "w-auto h-auto max-w-none max-h-none cursor-zoom-out transition-all duration-300 transform";
                container.classList.remove('items-center', 'justify-center');
                indicator.innerHTML = '<i class="fa-solid fa-magnifying-glass-minus"></i> 原寸大';
                isOriginalSize = true;
            } else {
                img.className = "max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform cursor-zoom-in";
                container.classList.add('items-center', 'justify-center');
                indicator.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> フィット';
                isOriginalSize = false;
            }
        }

        // --- 出力（エクスポート）関連機能 ---
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            isSettingsOpen = !isSettingsOpen;
            if (isSettingsOpen) {
                document.getElementById('settings-filter-label').textContent = currentPeriodFilter;
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.remove('scale-95'); }, 10);
            } else {
                modal.classList.add('opacity-0'); modal.querySelector('div').classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 300);
            }
        }

        function getTargetsForExport() {
            const checkedBoxes = Array.from(document.querySelectorAll('.entry-checkbox:checked'));
            if (checkedBoxes.length > 0) {
                const checkedIds = checkedBoxes.map(cb => cb.value);
                return diaryItems.filter(item => checkedIds.includes(item.id));
            }
            const renderedIds = Array.from(document.querySelectorAll('.diary-card')).map(card => card.getAttribute('data-id'));
            return diaryItems.filter(item => renderedIds.includes(item.id));
        }

        function downloadBlob(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
            toggleSettings();
        }

        function exportData(type) {
            const targets = getTargetsForExport();
            if (targets.length === 0) { alert("出力するデータがありません。"); return; }

            const dateStr = new Date().toISOString().slice(0, 10);
            if (type === 'json') {
                const data = JSON.stringify(targets, null, 2);
                downloadBlob(data, `SmartDiary_Backup_${dateStr}.json`, 'application/json');
            } else if (type === 'markdown') {
                const data = targets.map(item => {
                    let md = `## ${item.date}\n\n${item.content}\n\n`;
                    if (item.tags && item.tags.length > 0) md += `Tags: ${item.tags.map(t => `#${t}`).join(' ')}\n\n`;
                    if (item.media && item.media.originalName) md += `![メディア](./originals/${item.media.originalName})\n\n`;
                    return md;
                }).join('---\n\n');
                downloadBlob(data, `SmartDiary_Export_${dateStr}.md`, 'text/markdown');
            }
        }

        function exportPDF() {
            const checkedBoxes = document.querySelectorAll('.entry-checkbox:checked');
            if (checkedBoxes.length > 0) {
                document.querySelectorAll('.diary-card').forEach(card => {
                    const checkbox = card.querySelector('.entry-checkbox');
                    if (!checkbox || !checkbox.checked) {
                        card.classList.add('hidden', 'no-print-temp');
                    }
                });
            }
            
            toggleSettings();
            setTimeout(() => {
                window.print();
                document.querySelectorAll('.no-print-temp').forEach(card => {
                    card.classList.remove('hidden', 'no-print-temp');
                });
            }, 400);
        }
    </script>
