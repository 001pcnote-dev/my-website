<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SmartDiary</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .dragging { opacity: 0.5; transform: scale(0.98); border: 2px dashed #3b82f6; }
        .cursor-zoom-in { cursor: zoom-in; }
        .cursor-zoom-out { cursor: zoom-out; }
    </style>
</head>
<body class="min-h-[100dvh] flex justify-center bg-gray-100 sm:p-4 md:p-6 overflow-hidden">

    <div class="w-full max-w-4xl h-[100dvh] sm:h-[calc(100vh-2rem)] bg-slate-50 sm:rounded-[24px] overflow-hidden flex flex-col relative shadow-2xl border border-gray-200">
        
        <div class="bg-white border-b border-gray-200 px-4 py-3 sm:px-6 sm:py-4 flex flex-col gap-3 z-20 pt-safe transition-all">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2 sm:gap-4 min-w-0 flex-1">
                    <button onclick="toggleCalendarView()" class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 p-2 rounded-xl transition-colors shrink-0" title="月間カレンダーを表示">
                        <i id="cal-toggle-icon" class="fa-solid fa-calendar-days text-lg"></i>
                    </button>
                    <h1 class="text-base sm:text-lg font-bold text-gray-800 truncate tracking-tight">
                        <span id="display-date">----年--月--日</span>
                    </h1>
                </div>
                
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="toggleSearchRow()" id="search-toggle-btn" class="text-gray-500 hover:text-indigo-600 bg-gray-100 hover:bg-indigo-50 p-2 rounded-full transition-all text-sm" title="日記を検索">
                        <i class="fa-solid fa-magnifying-glass text-base"></i>
                    </button>
                    <button onclick="openSettingsModal()" class="text-gray-500 hover:text-gray-800 bg-gray-100 hover:bg-gray-200 p-2 rounded-full transition-all text-sm" title="設定を開く">
                        <i class="fa-solid fa-gear text-base"></i>
                    </button>
                    <div onclick="refreshWeather(true)" class="flex items-center gap-1.5 bg-blue-50 hover:bg-blue-100 transition-all px-3 py-1.5 rounded-full border border-blue-200 cursor-pointer shadow-sm" title="天気を更新">
                        <span id="weather-icon" class="text-base"><i class="fa-solid fa-cloud-sun text-blue-500"></i></span>
                        <div class="flex flex-col text-left leading-none">
                            <span id="weather-temp" class="text-sm font-bold text-blue-700">--°C</span>
                            <span id="weather-range" class="text-[10px] font-medium text-gray-500 mt-0.5">取得中</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="search-bar-row" class="hidden w-full pt-1 pb-1 transition-all">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="performSearch(this.value)" placeholder="文章、ファイル名、画像等で検索..." class="w-full bg-gray-100 focus:bg-white border border-gray-200 focus:border-indigo-400 rounded-xl pl-10 pr-10 py-2.5 text-base text-gray-700 outline-none transition-all shadow-inner">
                    <button onclick="clearSearch()" class="absolute right-3 text-gray-400 hover:text-gray-600 p-1"><i class="fa-solid fa-circle-xmark text-lg"></i></button>
                </div>
            </div>
        </div>

        <div id="sort-control-bar" class="bg-gray-50 border-b border-gray-200 px-4 py-2 sm:px-6 flex justify-between items-center z-10 text-sm text-gray-600 shadow-sm">
            <div class="flex items-center gap-4">
                <button onclick="toggleMonthlyListView()" id="monthly-list-btn" class="flex items-center gap-1.5 text-gray-500 hover:text-indigo-600 font-medium px-2 py-1 rounded transition-colors" title="月間一覧表示">
                    <i class="fa-solid fa-list-ul"></i> <span class="hidden sm:inline">一覧モード</span>
                </button>
                <div class="flex items-center gap-1.5 font-medium">
                    <i class="fa-solid fa-arrow-down-short-wide text-indigo-500"></i>
                    <span class="hidden sm:inline">表示順:</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <select id="sort-select" onchange="handleSortChange(this.value)" class="bg-white border border-gray-300 rounded-lg px-2 py-1 text-sm text-gray-700 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 cursor-pointer shadow-sm">
                    <option value="time-asc">古い順</option>
                    <option value="time-desc">新しい順</option>
                    <option value="type">種類順</option>
                </select>
                <div class="flex items-center bg-white border border-gray-200 rounded-lg shadow-sm overflow-hidden">
                    <button onclick="navigateDay(-1)" class="px-3 py-1 text-gray-500 hover:bg-gray-100 hover:text-indigo-600 border-r border-gray-200 transition-colors"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="navigateDay(1)" class="px-3 py-1 text-gray-500 hover:bg-gray-100 hover:text-indigo-600 transition-colors"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <div class="flex-1 relative overflow-hidden flex flex-col bg-slate-50/50">
            <div id="diary-sheet" class="absolute inset-0 overflow-y-auto px-4 py-4 sm:px-8 sm:py-6 space-y-4 no-scrollbar transition-opacity duration-200 pb-32">
                <div id="empty-state" class="flex flex-col items-center justify-center py-24 text-center text-gray-400">
                    <i class="fa-solid fa-folder-closed text-6xl mb-5 text-emerald-300 drop-shadow-sm"></i>
                    <p class="text-base font-bold text-gray-600">保存先フォルダが未設定です</p>
                    <p class="text-sm mt-3 px-6 text-gray-500 leading-relaxed max-w-sm">右上の設定アイコンから、データを保存するフォルダを選択してください。</p>
                </div>
            </div>

            <div id="month-calendar-view" class="absolute inset-0 bg-white z-10 hidden flex flex-col p-4 sm:p-8 overflow-y-auto no-scrollbar pb-32">
                <div class="flex justify-between items-center mb-6">
                    <button onclick="navigateMonth(-1)" class="p-2 sm:p-3 text-gray-600 hover:bg-gray-100 rounded-xl transition-colors"><i class="fa-solid fa-chevron-left text-xl"></i></button>
                    <h2 id="calendar-month-title" class="text-lg sm:text-2xl font-bold text-gray-800 tracking-wide">2026年 05月</h2>
                    <button onclick="navigateMonth(1)" class="p-2 sm:p-3 text-gray-600 hover:bg-gray-100 rounded-xl transition-colors"><i class="fa-solid fa-chevron-right text-xl"></i></button>
                </div>
                <div class="grid grid-cols-7 text-center text-xs sm:text-sm font-bold text-gray-400 mb-3 tracking-wider">
                    <div class="text-red-500">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div class="text-blue-500">SAT</div>
                </div>
                <div id="calendar-days-grid" class="grid grid-cols-7 gap-y-4 gap-x-2 sm:gap-x-4 justify-items-center text-base sm:text-lg"></div>
            </div>
        </div>

        <div id="toast" class="absolute bottom-28 left-1/2 transform -translate-x-1/2 bg-gray-900/90 backdrop-blur text-white text-sm px-5 py-2.5 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-40 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-text" class="font-medium">保存完了</span>
        </div>

        <div id="app-bottom-bar" class="bg-white border-t border-gray-200 px-3 py-3 sm:px-6 sm:py-4 flex justify-between items-center shadow-[0_-5px_15px_rgba(0,0,0,0.03)] z-30 pb-safe">
            <div class="grid grid-cols-6 gap-2 sm:gap-4 w-full max-w-2xl mx-auto">
                <button onclick="addDiaryItem('text')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 active:scale-95 transition-all group" title="テキスト">
                    <i class="fa-solid fa-font text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">テキスト</span>
                </button>
                <button onclick="addDiaryItem('calendar')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-rose-50 hover:text-rose-600 active:scale-95 transition-all group" title="イベント">
                    <i class="fa-solid fa-calendar-plus text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">イベント</span>
                </button>
                <button onclick="triggerFileInput('image-input')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-emerald-50 hover:text-emerald-600 active:scale-95 transition-all group" title="画像">
                    <i class="fa-solid fa-image text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">画像</span>
                </button>
                <button onclick="triggerFileInput('video-input')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-sky-50 hover:text-sky-600 active:scale-95 transition-all group" title="動画">
                    <i class="fa-solid fa-video text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">動画</span>
                </button>
                <button onclick="triggerFileInput('audio-input')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-amber-50 hover:text-amber-600 active:scale-95 transition-all group" title="音声">
                    <i class="fa-solid fa-microphone text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">音声</span>
                </button>
                <button onclick="addDiaryItem('weather')" class="flex flex-col items-center justify-center h-14 sm:h-16 rounded-2xl text-gray-600 hover:bg-blue-50 hover:text-blue-600 active:scale-95 transition-all group" title="天気">
                    <i class="fa-solid fa-cloud-sun text-xl sm:text-2xl mb-1 group-hover:scale-110 transition-transform"></i>
                    <span class="text-[9px] sm:text-[10px] font-bold">天気</span>
                </button>
            </div>
        </div>

        <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'image')">
        <input type="file" id="video-input" accept="video/*" class="hidden" onchange="handleFileSelect(event, 'video')">
        <input type="file" id="audio-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event, 'audio')">

    </div>

    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity duration-300 opacity-0 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeSettingsModal()">
        <div class="w-full sm:max-w-md bg-white rounded-t-[32px] sm:rounded-[32px] p-6 sm:p-8 space-y-6 transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b pb-4 border-gray-100 sticky top-0 bg-white z-10">
                <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-sliders text-indigo-600"></i> アプリ設定</h3>
                <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-800 p-2 bg-gray-100 rounded-full transition-colors"><i class="fa-solid fa-xmark text-lg w-5 h-5 flex items-center justify-center"></i></button>
            </div>

            <div class="space-y-3">
                <h4 class="text-sm font-bold text-gray-500 uppercase tracking-widest">🔔 アプリ・通知設定</h4>
                <button onclick="requestNotificationPermission()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-bell"></i> ローカル通知を許可する
                </button>
                <p class="text-xs text-gray-500 mt-1 leading-relaxed">※リマインダー等の表示に使用します。OS側で許可が必要です。</p>
            </div>

            <div class="space-y-3 border-t pt-5 border-gray-100">
                <h4 class="text-sm font-bold text-gray-500 uppercase tracking-widest">💾 データ同期管理</h4>
                <button onclick="selectExternalFolder()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-folder-gear text-lg"></i> <span id="folder-btn-text">保存先フォルダを選択・同期</span>
                </button>
                <div id="folder-status" class="text-xs text-gray-600 bg-emerald-50/80 p-3 rounded-xl border border-emerald-200 space-y-1 hidden">
                    <div class="flex items-center text-emerald-700 font-bold"><i class="fa-solid fa-circle-check mr-1.5"></i> 正常に同期中</div>
                    <div class="truncate text-gray-700">対象: <span id="folder-path-name" class="font-mono font-bold">未設定</span></div>
                </div>
            </div>

            <div class="space-y-3 border-t pt-5 border-gray-100">
                <h4 class="text-sm font-bold text-gray-500 uppercase tracking-widest">☀️ 天気設定</h4>
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-200">
                    <label for="weather-auto-toggle" class="text-sm font-bold text-gray-700 cursor-pointer">現在地から自動取得</label>
                    <input type="checkbox" id="weather-auto-toggle" onchange="toggleWeatherAuto(this.checked)" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer">
                </div>
                <div id="weather-manual-settings" class="space-y-3 hidden">
                    <label class="block text-xs font-bold text-gray-500">指定地域 (最大2箇所)</label>
                    <input type="text" id="weather-loc-1" placeholder="地域1 (例: 東京)" onchange="saveWeatherSettings()" class="w-full bg-white border border-gray-300 rounded-xl py-2 px-3 text-base focus:ring-2 focus:ring-indigo-500 outline-none text-gray-800 shadow-sm">
                    <input type="text" id="weather-loc-2" placeholder="地域2 (例: 大阪)" onchange="saveWeatherSettings()" class="w-full bg-white border border-gray-300 rounded-xl py-2 px-3 text-base focus:ring-2 focus:ring-indigo-500 outline-none text-gray-800 shadow-sm">
                </div>
            </div>

            <div class="space-y-3 border-t pt-5 border-gray-100">
                <h4 class="text-sm font-bold text-gray-500 uppercase tracking-widest">📤 出力・バックアップ</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">出力範囲</label>
                        <select id="export-range" onchange="toggleExportRangeUI()" class="w-full bg-white border border-gray-300 rounded-xl py-2 px-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800 shadow-sm">
                            <option value="daily">日別（指定・複数可）</option>
                            <option value="monthly">月別（指定月）</option>
                            <option value="all">すべての蓄積データ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">フォーマット</label>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button onclick="setFormat('pdf')" id="btn-pdf" class="format-btn py-2 text-xs font-bold rounded-xl border bg-indigo-50 border-indigo-500 text-indigo-700 transition-colors">PDF</button>
                            <button onclick="setFormat('html')" id="btn-html" class="format-btn py-2 text-xs font-bold rounded-xl border bg-gray-50 border-gray-300 text-gray-600 transition-colors">HTML</button>
                            <button onclick="setFormat('txt')" id="btn-txt" class="format-btn py-2 text-xs font-bold rounded-xl border bg-gray-50 border-gray-300 text-gray-600 transition-colors">TXT</button>
                            <button onclick="setFormat('md')" id="btn-md" class="format-btn py-2 text-xs font-bold rounded-xl border bg-gray-50 border-gray-300 text-gray-600 transition-colors">MD</button>
                        </div>
                    </div>
                </div>

                <div id="export-daily-selector" class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500">出力する日付を選択</label>
                    <div id="export-days-checklist" class="max-h-32 overflow-y-auto border border-gray-300 rounded-xl p-3 bg-white space-y-2 text-sm text-gray-800 no-scrollbar shadow-inner"></div>
                </div>

                <div id="export-monthly-selector" class="space-y-2 hidden">
                    <label class="block text-xs font-bold text-gray-500">出力対象の月を選択</label>
                    <input type="month" id="export-month-input" class="w-full bg-white border border-gray-300 rounded-xl py-2 px-3 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 text-gray-800 shadow-sm">
                </div>

                <button onclick="triggerExport()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition-all shadow-md flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-file-export text-lg"></i> ファイルを出力・印刷する
                </button>
            </div>
            
            <div class="h-6 sm:h-0"></div>
        </div>
    </div>

    <div id="image-lightbox" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeLightbox()">
        <div class="absolute top-4 right-4 flex items-center gap-4 text-white z-50" onclick="event.stopPropagation()">
            <span id="zoom-indicator" class="text-sm bg-white/20 px-3 py-1.5 rounded-full flex items-center gap-1.5 font-medium backdrop-blur">
                <i class="fa-solid fa-magnifying-glass-plus"></i> フィット
            </span>
            <button class="text-white hover:text-gray-300 text-4xl p-2 focus:outline-none transition-transform active:scale-90" onclick="closeLightbox()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="lightbox-scroll-container" class="w-full h-full flex items-center justify-center overflow-auto no-scrollbar p-2">
            <img id="lightbox-img" src="" alt="拡大画像" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform scale-95 cursor-zoom-in" onclick="toggleImageZoom(event)">
        </div>
    </div>

    <script>
        // ドラッグドロップのスマホ用ポリフィルを有効化
        MobileDragDrop.polyfill({ holdToDrag: 200 });

        // PWA マニフェスト動的生成
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#E0E7FF"/><rect x="140" y="100" width="232" height="312" rx="20" fill="#FFFFFF"/><rect x="130" y="100" width="20" height="312" rx="10" fill="#C7D2FE"/><line x1="180" y1="180" x2="330" y2="180" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/><line x1="180" y1="240" x2="330" y2="240" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/><line x1="180" y1="300" x2="280" y2="300" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/><circle cx="340" cy="100" r="30" fill="#FDE68A"/></svg>`;
        const encodedIcon = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgIcon)));
        const manifest = {
            name: "SmartDiary", short_name: "SmartDiary", start_url: location.pathname || ".", display: "standalone",
            background_color: "#f3f4f6", theme_color: "#ffffff",
            icons: [{ src: encodedIcon, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.head.insertAdjacentHTML('beforeend', `<link rel="manifest" href="${URL.createObjectURL(manifestBlob)}">`);

        // Service Worker の動的登録 (HTTPS or Localhost時)
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
            const swCode = `
                const CACHE_NAME = 'smartdiary-v2';
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW登録エラー:', err));
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) { alert("このブラウザは通知機能に対応していません。"); return; }
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                new Notification("SmartDiary", { body: "通知が有効になりました。", icon: encodedIcon });
                showToast("通知を許可しました");
            } else { alert("通知が拒否されました。OSやブラウザの設定をご確認ください。"); }
        }

        // グローバル変数
        let currentTargetDate = "";
        let diaryItems = []; 
        let fullMasterDatabase = {}; 
        let currentFormat = 'pdf';
        let directoryHandle = null;
        const MASTER_FILE_NAME = "master_diary_data.json";
        let activeBlobUrls = {};
        let isCalendarViewMode = false;
        let isSearchingMode = false; 
        let isMonthlyListMode = false;
        let calendarYear = 2026;
        let calendarMonth = 5;
        let currentSortKey = "time-asc";

        let weatherConfig = JSON.parse(localStorage.getItem('smart_diary_weather_config')) || {
            useAutoLocation: true, manualLocations: ["", ""]
        };

        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            
            const sheet = document.getElementById('diary-sheet');
            sheet.addEventListener('dragover', handleDragOver);
            sheet.addEventListener('drop', handleDrop);

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeLightbox(); closeSettingsModal();
                    if (isSearchingMode) toggleSearchRow();
                }
            });

            const today = new Date();
            const initialDateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            currentTargetDate = initialDateStr;
            document.getElementById('export-month-input').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
            calendarYear = today.getFullYear();
            calendarMonth = today.getMonth() + 1;

            updateDateDisplay(initialDateStr);
            toggleExportRangeUI();
            initWeatherSettingsUI();
            
            // アドレスバーを隠すためのスクロールハック（スマホ時）
            setTimeout(() => window.scrollTo(0, 1), 100);
        });

        function initWeatherSettingsUI() {
            const toggle = document.getElementById('weather-auto-toggle');
            const loc1 = document.getElementById('weather-loc-1');
            const loc2 = document.getElementById('weather-loc-2');
            toggle.checked = weatherConfig.useAutoLocation;
            loc1.value = weatherConfig.manualLocations[0] || "";
            loc2.value = weatherConfig.manualLocations[1] || "";
            toggleWeatherAuto(weatherConfig.useAutoLocation, false);
            refreshWeather(false); 
        }

        function toggleWeatherAuto(isEnabled, doSave = true) {
            weatherConfig.useAutoLocation = isEnabled;
            const manualDiv = document.getElementById('weather-manual-settings');
            if (isEnabled) manualDiv.classList.add('hidden');
            else manualDiv.classList.remove('hidden');
            if (doSave) saveWeatherSettings();
        }

        function saveWeatherSettings() {
            weatherConfig.manualLocations[0] = document.getElementById('weather-loc-1').value.trim();
            weatherConfig.manualLocations[1] = document.getElementById('weather-loc-2').value.trim();
            localStorage.setItem('smart_diary_weather_config', JSON.stringify(weatherConfig));
            WeatherRepository.cache = { data: null, lastUpdated: 0 };
            refreshWeather(true);
        }

        function updateClock() {
            const now = new Date();
            const timeEl = document.getElementById('android-time');
            if(timeEl) timeEl.innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        function toggleSearchRow() {
            const row = document.getElementById('search-bar-row');
            const btn = document.getElementById('search-toggle-btn');
            const input = document.getElementById('search-input');
            isSearchingMode = !isSearchingMode;
            if (isSearchingMode) {
                if (isMonthlyListMode) toggleMonthlyListView();
                row.classList.remove('hidden');
                btn.classList.add('text-indigo-600', 'bg-indigo-50');
                input.focus();
                if (isCalendarViewMode) toggleCalendarView();
            } else {
                row.classList.add('hidden');
                btn.classList.remove('text-indigo-600', 'bg-indigo-50');
                input.value = "";
                loadDiaryFromMaster(); 
            }
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = ""; input.focus();
            if (isSearchingMode) performSearch("");
        }

        function navigateDay(offset) {
            if (isMonthlyListMode) toggleMonthlyListView();
            const parts = currentTargetDate.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            d.setDate(d.getDate() + offset);
            const newDateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            changeDate(newDateStr);
        }

        function toggleMonthlyListView() {
            isMonthlyListMode = !isMonthlyListMode;
            const btn = document.getElementById('monthly-list-btn');
            if(isMonthlyListMode) {
                btn.classList.add('text-indigo-600', 'bg-indigo-100');
                btn.classList.remove('text-gray-500');
            } else {
                btn.classList.remove('text-indigo-600', 'bg-indigo-100');
                btn.classList.add('text-gray-500');
            }
            loadDiaryFromMaster();
        }

        function performSearch(keyword) {
            const cleanedKeyword = keyword.trim().toLowerCase();
            if (!cleanedKeyword) { loadDiaryFromMaster(); return; }
            let hitResults = [];
            Object.keys(fullMasterDatabase).forEach(dateStr => {
                const dayItems = fullMasterDatabase[dateStr] || [];
                dayItems.forEach(item => {
                    let match = false;
                    if (item.type === 'text' && item.value.toLowerCase().includes(cleanedKeyword)) match = true;
                    else if (item.type === 'calendar' || item.type === 'weather') {
                        const v = (item.value || "").toLowerCase(); const l = (item.location || "").toLowerCase(); const m = (item.memo || "").toLowerCase();
                        if (v.includes(cleanedKeyword) || l.includes(cleanedKeyword) || m.includes(cleanedKeyword)) match = true;
                    } 
                    else if (['image', 'video', 'audio'].includes(item.type)) {
                        const fName = (item.fileName || "").toLowerCase(); const extName = (item.externalName || "").toLowerCase();
                        if (fName.includes(cleanedKeyword) || extName.includes(cleanedKeyword)) match = true;
                        else if (cleanedKeyword === '画像' && item.type === 'image') match = true;
                        else if (cleanedKeyword === '動画' && item.type === 'video') match = true;
                        else if (cleanedKeyword === '音声' && item.type === 'audio') match = true;
                    }
                    if (match) hitResults.push({ ...item, belongingDate: dateStr });
                });
            });
            renderSearchResults(hitResults, keyword);
        }

        function renderSearchResults(results, query) {
            const sheet = document.getElementById('diary-sheet');
            const emptyState = document.getElementById('empty-state');
            sheet.querySelectorAll('.diary-card').forEach(card => card.remove());

            if (results.length === 0) {
                emptyState.innerHTML = `<i class="fa-solid fa-magnifying-glass text-5xl mb-4 text-gray-300"></i><p class="text-base font-bold text-gray-500">「${query}」に一致する記録は見つかりません</p>`;
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';
            results.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'diary-card bg-white rounded-2xl shadow-sm border-2 border-transparent hover:border-indigo-400 p-4 sm:p-5 flex flex-col gap-3 transition-all relative cursor-pointer active:scale-[0.99]';
                card.onclick = () => { toggleSearchRow(); changeDate(item.belongingDate); showToast(`${item.belongingDate} へ移動しました`); };

                let badgeColor = "text-indigo-500"; let typeName = item.type;
                if(item.type === 'calendar') { badgeColor = "text-rose-500 font-bold"; typeName = "📅 EVENT"; }
                if(item.type === 'image') badgeColor = "text-emerald-500";
                if(item.type === 'video') badgeColor = "text-sky-500";
                if(item.type === 'audio') badgeColor = "text-amber-500";
                if(item.type === 'weather') { badgeColor = "text-blue-500 font-bold"; typeName = "☀️ WEATHER"; }

                let headerHTML = `
                    <div class="flex justify-between items-center text-xs font-bold text-gray-400 border-b border-gray-50 pb-2 select-none">
                        <div class="flex items-center gap-2 text-gray-500">
                            <span class="bg-indigo-600 text-white font-mono px-2 py-0.5 rounded-md text-[10px]"><i class="fa-solid fa-calendar-day mr-1"></i>${item.belongingDate}</span>
                            <span class="${badgeColor} uppercase tracking-wider">${typeName}</span>
                            <span class="text-gray-400 font-mono">• ${item.timestamp}</span>
                        </div>
                        <span class="text-indigo-500 text-[10px] font-bold">移動 <i class="fa-solid fa-chevron-right ml-0.5"></i></span>
                    </div>
                `;
                let bodyHTML = ''; const uniquePlayerId = `search-player-${item.id}`;

                if (item.type === 'text') {
                    bodyHTML = `<div class="prose prose-sm prose-indigo max-w-none text-sm text-gray-700 bg-transparent whitespace-pre-wrap">${marked.parse(item.value || '')}</div>`;
                } else if (item.type === 'image') {
                    bodyHTML = `<div class="rounded-xl overflow-hidden border border-gray-100 max-h-48 bg-gray-50 flex justify-center"><img id="${uniquePlayerId}" class="max-h-48 object-contain w-full"></div><span class="text-xs text-gray-400 truncate block mt-1"><i class="fa-solid fa-file-image mr-1.5"></i>${item.fileName}</span>`;
                } else if (item.type === 'video') {
                    bodyHTML = `<div class="rounded-xl overflow-hidden border border-gray-100 max-h-48 bg-black flex justify-center" onclick="event.stopPropagation()"><video id="${uniquePlayerId}" controls class="max-h-48 w-full"></video></div><span class="text-xs text-gray-400 truncate block mt-1"><i class="fa-solid fa-file-video mr-1.5"></i>${item.fileName}</span>`;
                } else if (item.type === 'audio') {
                    bodyHTML = `<div class="bg-gray-50 p-2 rounded-xl border border-gray-100" onclick="event.stopPropagation()"><audio id="${uniquePlayerId}" controls class="w-full h-10"></audio></div><span class="text-xs text-gray-400 truncate block mt-1"><i class="fa-solid fa-file-audio mr-1.5"></i>${item.fileName}</span>`;
                } else if (item.type === 'calendar') {
                    bodyHTML = `<div class="bg-rose-50/70 p-3 rounded-xl border border-rose-100 flex flex-col gap-1.5 w-full text-sm"><div class="font-bold text-gray-800 text-base"><i class="fa-solid fa-calendar-check text-rose-500 mr-2"></i>${item.value}</div>${item.location ? `<div class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-location-dot mr-1.5 text-gray-400"></i>${item.location}</div>` : ''}${item.memo ? `<div class="text-xs text-gray-500 bg-white/60 rounded-lg p-2 mt-1.5">${item.memo}</div>` : ''}</div>`;
                } else if (item.type === 'weather') {
                    bodyHTML = `<div class="bg-blue-50 p-3 rounded-xl border border-blue-100 flex items-center gap-3"><div class="text-3xl">${item.icon}</div><div class="text-sm font-bold text-gray-700">${item.value} <span class="text-xs text-gray-500 ml-1">(${item.location})</span></div></div>`;
                }
                card.innerHTML = headerHTML + bodyHTML;
                sheet.appendChild(card);
                if (['image', 'video', 'audio'].includes(item.type)) loadAndPlayMedia(item.externalName, uniquePlayerId, item.type);
            });

        function handleSortChange(sortKey) {
            currentSortKey = sortKey; sortAndRenderDiary();
        }

        function sortAndRenderDiary() {
            if (currentSortKey === "time-asc") diaryItems.sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
            else if (currentSortKey === "time-desc") diaryItems.sort((a, b) => (b.timestamp || "").localeCompare(a.timestamp || ""));
            else if (currentSortKey === "type") diaryItems.sort((a, b) => (a.type || "").localeCompare(b.type || ""));
            renderDiaryItems();
        }

        function changeDate(dateString) {
            currentTargetDate = dateString;
            const parts = dateString.split('-');
            calendarYear = parseInt(parts[0]); calendarMonth = parseInt(parts[1]);
            updateDateDisplay(dateString); loadDiaryFromMaster();
            if (isCalendarViewMode) renderMonthCalendar();
        }

        function updateDateDisplay(dateString) {
            const parts = dateString.split('-'); const d = new Date(parts[0], parts[1] - 1, parts[2]);
            const weekdaysEn = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            document.getElementById('display-date').innerHTML = `${parts[0]}年${parts[1]}月${parts[2]}日 <span class="text-sm text-gray-400 font-normal font-mono ml-1">(${weekdaysEn[d.getDay()]})</span>`;
        }

        function loadDiaryFromMaster() {
            if (!directoryHandle) return;
            if (isMonthlyListMode) {
                diaryItems = [];
                const prefix = `${calendarYear}-${String(calendarMonth).padStart(2, '0')}-`;
                Object.keys(fullMasterDatabase).sort().forEach(dateStr => {
                    if (dateStr.startsWith(prefix)) {
                        fullMasterDatabase[dateStr].forEach(item => { diaryItems.push({ ...item, belongingDate: dateStr }); });
                    }
                });
            } else {
                diaryItems = [...(fullMasterDatabase[currentTargetDate] || [])];
            }
            sortAndRenderDiary();
        }

        function openSettingsModal() {
            renderExportDaysChecklist();
            const modal = document.getElementById('settings-modal');
            const panel = modal.querySelector('div');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); panel.classList.remove('translate-y-full'); panel.classList.remove('sm:translate-y-10'); panel.classList.remove('sm:scale-95'); }, 10);
        }

        function closeSettingsModal() {
            const modal = document.getElementById('settings-modal');
            const panel = modal.querySelector('div');
            modal.classList.add('opacity-0');
            panel.classList.add('translate-y-full');
            panel.classList.add('sm:scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function toggleExportRangeUI() {
            const range = document.getElementById('export-range').value;
            const dailySelector = document.getElementById('export-daily-selector');
            const monthlySelector = document.getElementById('export-monthly-selector');
            if (range === 'daily') { dailySelector.classList.remove('hidden'); monthlySelector.classList.add('hidden'); } 
            else if (range === 'monthly') { dailySelector.classList.add('hidden'); monthlySelector.classList.remove('hidden'); } 
            else { dailySelector.classList.add('hidden'); monthlySelector.classList.add('hidden'); }
        }

        function renderExportDaysChecklist() {
            const container = document.getElementById('export-days-checklist');
            container.innerHTML = "";
            const keys = Object.keys(fullMasterDatabase).sort();
            if(keys.length === 0){ container.innerHTML = '<span class="text-gray-400 text-xs">データが存在しません</span>'; return; }
            keys.forEach(dateStr => {
                const dayItems = fullMasterDatabase[dateStr] || [];
                if(dayItems.length === 0) return;
                const div = document.createElement('label');
                div.className = "flex items-center gap-3 py-1.5 cursor-pointer hover:bg-gray-50 px-2 rounded-lg transition-colors";
                div.innerHTML = `<input type="checkbox" name="export-target-dates" value="${dateStr}" checked class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4"> <span class="font-medium">${dateStr} <span class="text-xs text-gray-500 font-normal">(${dayItems.length}件)</span></span>`;

        function setFormat(format) {
            currentFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.className = 'format-btn py-2 text-xs font-bold rounded-xl border bg-gray-50 border-gray-300 text-gray-600 transition-colors';
            });
            document.getElementById(`btn-${format}`).className = 'format-btn py-2 text-xs font-bold rounded-xl border bg-indigo-50 border-indigo-500 text-indigo-700 transition-colors shadow-inner';
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => { toast.classList.replace('opacity-100', 'opacity-0'); }, 2500);
        }

        async function triggerExport() {
            const range = document.getElementById('export-range').value;
            let targetDataList = [];
            if (range === 'daily') {
                const checkedBoxes = document.querySelectorAll('input[name="export-target-dates"]:checked');
                if (checkedBoxes.length === 0) { alert('出力したい日付を1つ以上チェックしてください。'); return; }
                checkedBoxes.forEach(cb => {
                    const dateStr = cb.value;
                    if (fullMasterDatabase[dateStr]) targetDataList.push({ date: dateStr, items: fullMasterDatabase[dateStr] });
                });
            } else if (range === 'monthly') {
                const monthVal = document.getElementById('export-month-input').value;
                if (!monthVal) { alert('出力対象の月を正しく選択してください。'); return; }
                Object.keys(fullMasterDatabase).sort().forEach(dateStr => {
                    if (dateStr.startsWith(monthVal) && fullMasterDatabase[dateStr].length > 0) targetDataList.push({ date: dateStr, items: fullMasterDatabase[dateStr] });
                });
            } else {
                Object.keys(fullMasterDatabase).sort().forEach(dateStr => {
                    if (fullMasterDatabase[dateStr].length > 0) targetDataList.push({ date: dateStr, items: fullMasterDatabase[dateStr] });
                });
            }

            if (targetDataList.length === 0) { alert('出力対象のデータがありません。'); return; }

            if (currentFormat === 'txt') {
                let textResult = "";
                targetDataList.forEach(day => {
                    textResult += `【${day.date}】\n\n`;
                    day.items.forEach(i => {
                        if (i.type === 'text') textResult += `[${i.timestamp}]\n${i.value}\n`;
                        else if (i.type === 'calendar') textResult += `[${i.timestamp}] 📅 イベント: ${i.value} ${i.location ? '@'+i.location : ''} ${i.memo ? '('+i.memo+')' : ''}\n`;
                        else if (i.type === 'weather') textResult += `[${i.timestamp}] ☀️ 天気: ${i.value} ${i.location} ${i.memo ? '('+i.memo+')' : ''}\n`;
                        else {
                            const typeEmoji = i.type==='image'?'🖼️ 画像':(i.type==='video'?'🎥 動画':'🎵 音声');
                            textResult += `[${i.timestamp}] ${typeEmoji}: ${i.fileName}\n`;
                        }
                    });
                    textResult += "\n";
                });
                downloadBlob(textResult, `SmartDiary_Export_${Date.now()}.txt`, 'text/plain');

                        else if(i.type === 'video') html += `<div>🎥 動画ファイル: ${i.fileName}</div>`;
                        else if(i.type === 'audio') html += `<div>🎵 音声ファイル: ${i.fileName}</div>`;
                        else if(i.type === 'calendar') html += `<div class="event-box"><strong>📅 ${i.value}</strong>${i.location ? `<br>📍 場所: `+i.location : ''}${i.memo ? `<br>📝 メモ: `+i.memo : ''}</div>`;
                        else if(i.type === 'weather') html += `<div class="weather-box"><strong>☀️ ${i.value} (${i.location})</strong>${i.memo ? `<br>📝 `+i.memo : ''}</div>`;
                        html += `</div></div>`;
                    });
                    html += `</div>`;
                });
                html += `</body></html>`;
                printWindow.document.write(html); printWindow.document.close();
                printWindow.onload = function() { setTimeout(() => { printWindow.print(); }, 350); };
            }
        }

        function downloadBlob(content, fileName, contentType) {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([content], { type: contentType }));
            a.download = fileName; a.click();
        }

        const WeatherService = {
            isFetching: false,
            async fetch() {
                if (this.isFetching) throw new Error("リクエスト重複中");
                this.isFetching = true;
                try {
                    await new Promise(resolve => setTimeout(resolve, 800)); 
                    const mockData = [
                        { icon: '<i class="fa-solid fa-sun text-amber-500"></i>', temp: '26°C', range: '<span class="text-red-500">29°</span>/<span class="text-blue-500">19°</span>' },
                        { icon: '<i class="fa-solid fa-cloud-sun text-blue-400"></i>', temp: '22°C', range: '<span class="text-red-500">26°</span>/<span class="text-blue-500">16°</span>' },
                        { icon: '<i class="fa-solid fa-cloud-showers-heavy text-sky-500"></i>', temp: '18°C', range: '<span class="text-red-500">21°</span>/<span class="text-blue-500">14°</span>' }
                    ];
                    return mockData[Math.floor(Math.random() * mockData.length)];
                } finally {
                    this.isFetching = false;
                }
            }
        };

        const WeatherRepository = {
            cache: { data: null, lastUpdated: 0 },
            isCacheValid() { return this.cache.data && (Date.now() - this.cache.lastUpdated) < 24*60*60*1000; },
            async getWeather(forceUpdate = false) {
                if (!navigator.onLine) return this.cache.data;
                try {
                    if (!forceUpdate && this.isCacheValid()) return this.cache.data;
                    const newData = await WeatherService.fetch();
                    this.cache = { data: newData, lastUpdated: Date.now() };
                    return newData;
                } catch (e) { return this.cache.data; }
            }
        };

        async function refreshWeather(force = true) {
            const data = await WeatherRepository.getWeather(force);
            if (!data) return;
            
            const headerIconHtml = data.icon.replace('"></i>', ' text-sm"></i>');
            document.getElementById('weather-icon').innerHTML = headerIconHtml;
            document.getElementById('weather-temp').innerText = data.temp;
            document.getElementById('weather-range').innerHTML = data.range;

            if (force) showToast("天気を更新しました");

            const todayStr = `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-${String(new Date().getDate()).padStart(2, '0')}`;
            if (currentTargetDate === todayStr && directoryHandle) {
                let todaysItems = fullMasterDatabase[todayStr] || [];
                let hasWeather = todaysItems.some(i => i.type === 'weather');
                
                if (!hasWeather) {
                    let tempDiv = document.createElement('div');
                    tempDiv.innerHTML = data.range;
                    let plainRange = tempDiv.innerText || tempDiv.textContent;

                    let newItem = {
                        id: 'weather-' + Date.now(), type: 'weather',
                        timestamp: `${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`,
                        value: data.temp, location: plainRange, memo: "", icon: data.icon
                    };
                    todaysItems.push(newItem);
                    fullMasterDatabase[todayStr] = todaysItems;
                    
                    if (currentTargetDate === todayStr && !isMonthlyListMode && !isSearchingMode) {
                        diaryItems = [...todaysItems]; sortAndRenderDiary();

                    saveDiaryToFolder(false);

            }
        }

        function renderMonthCalendar() {
            const grid = document.getElementById('calendar-days-grid');
            const title = document.getElementById('calendar-month-title');
            grid.innerHTML = "";
            title.innerText = `${calendarYear}年 ${String(calendarMonth).padStart(2, '0')}月`;
            const firstDayIndex = new Date(calendarYear, calendarMonth - 1, 1).getDay();
            const totalDays = new Date(calendarYear, calendarMonth, 0).getDate();
            for (let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div'); grid.appendChild(blank);
            }

            for (let day = 1; day <= totalDays; day++) {
                const formattedDayStr = `${calendarYear}-${String(calendarMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('button');
                cell.className = "w-10 h-10 sm:w-12 sm:h-12 flex flex-col items-center justify-center rounded-2xl transition-all relative font-medium text-gray-700 hover:bg-indigo-50 active:scale-90 border border-transparent hover:border-indigo-100";
                const today = new Date();
                const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
                if (formattedDayStr === todayStr) cell.classList.add('bg-indigo-50', 'text-indigo-700', 'font-bold', 'border-indigo-200');
                if (formattedDayStr === currentTargetDate) {
                    cell.classList.remove('bg-indigo-50', 'text-indigo-700', 'border-indigo-200');
                    cell.classList.add('bg-indigo-600', 'text-white', 'font-bold', 'shadow-md', 'shadow-indigo-200');
                }

                const labelSpan = document.createElement('span');
                labelSpan.innerText = day;
                cell.appendChild(labelSpan);

                const dayData = fullMasterDatabase[formattedDayStr] || [];
                if (dayData.length > 0) {
                    const dot = document.createElement('span');
                    dot.className = "absolute bottom-1.5 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-sm";
                    if (formattedDayStr === currentTargetDate) dot.className = "absolute bottom-1.5 w-1.5 h-1.5 rounded-full bg-white shadow-sm";
                    cell.appendChild(dot);
                }

                cell.onclick = () => { toggleCalendarView(); changeDate(formattedDayStr); };
                grid.appendChild(cell);
            }
        }

            calendarMonth += direction;
            if (calendarMonth > 12) { calendarMonth = 1; calendarYear++; }
            if (calendarMonth < 1) { calendarMonth = 12; calendarYear--; }
            renderMonthCalendar();

            document.getElementById(id).click();

        async function selectExternalFolder() {
            if (!window.showDirectoryPicker) {
                alert("お使いのブラウザはフォルダ同期機能に対応していません。\nPC版のChromeやEdge等をご利用ください。\n(iOS Safari等ではセキュリティ上の理由でファイルシステムに直接アクセスできません)");
                return;
            }
            try {
                directoryHandle = await window.showDirectoryPicker({ mode: "readwrite" });
                document.getElementById('folder-path-name').innerText = directoryHandle.name;
                document.getElementById('folder-status').classList.remove('hidden');
                document.getElementById('empty-state').classList.add('hidden');
                document.getElementById('folder-btn-text').innerText = "同期フォルダを変更";
                
                await syncLoadMasterDatabase();
                loadDiaryFromMaster();
                refreshWeather(false);
                showToast("フォルダ同期に成功しました");
            } catch (err) {
                console.error(err);
                if (err.name !== 'AbortError') alert("フォルダへのアクセスが拒否されました。");
            }
        }

        async function syncLoadMasterDatabase() {
            if (!directoryHandle) return;
            try {
                const fileHandle = await directoryHandle.getFileHandle(MASTER_FILE_NAME, { create: true });
                const file = await fileHandle.getFile();
                const text = await file.text();
                if (text.trim()) fullMasterDatabase = JSON.parse(text);
                else fullMasterDatabase = {};
            } catch (err) { console.error("DB読込エラー:", err); fullMasterDatabase = {}; }
        }

        async function saveDiaryToFolder(syncFromDiaryItems = true) {
            if (!directoryHandle) return;
            try {
                if (syncFromDiaryItems && !isMonthlyListMode && !isSearchingMode) fullMasterDatabase[currentTargetDate] = [...diaryItems];
                const fileHandle = await directoryHandle.getFileHandle(MASTER_FILE_NAME, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(fullMasterDatabase, null, 2));
                await writable.close();
                showToast("自動保存完了");
            } catch (err) { console.error("保存エラー:", err); showToast("保存エラー"); }
        }

        async function saveMediaFileToFolder(file, customFileName, type) {
            if (!directoryHandle) return false;
            try {
                let folderName = '';
                if (type === 'image') folderName = 'picture';
                else if (type === 'video') folderName = 'video';
                else if (type === 'audio') folderName = 'audio';

                let targetDirHandle = directoryHandle;
                if (folderName) targetDirHandle = await directoryHandle.getDirectoryHandle(folderName, { create: true });

                const fileHandle = await targetDirHandle.getFileHandle(customFileName, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(file);
                await writable.close();
                return true;
            } catch (err) { console.error("メディア保存エラー:", err); return false; }
        }

        async function loadAndPlayMedia(externalName, elementId, type) {
            if (!directoryHandle || !externalName) return;
            if (activeBlobUrls[externalName]) {
                const mediaEl = document.getElementById(elementId);
                if (mediaEl && !mediaEl.src) mediaEl.src = activeBlobUrls[externalName];
                return;
            }
            try {
                let folderName = '';
                if (type === 'image') folderName = 'picture';
                else if (type === 'video') folderName = 'video';
                else if (type === 'audio') folderName = 'audio';

                let targetDirHandle = directoryHandle; let fileHandle;
                try {
                    if (folderName) {
                        const subDirHandle = await directoryHandle.getDirectoryHandle(folderName, { create: false });
                        fileHandle = await subDirHandle.getFileHandle(externalName, { create: false });
                    } else { fileHandle = await directoryHandle.getFileHandle(externalName, { create: false }); }
                } catch (e) { fileHandle = await directoryHandle.getFileHandle(externalName, { create: false }); }

                const file = await fileHandle.getFile();
                const blobUrl = URL.createObjectURL(file);
                activeBlobUrls[externalName] = blobUrl;
                const mediaEl = document.getElementById(elementId);
                if (mediaEl) mediaEl.src = blobUrl;
            } catch (err) { console.error("メディア再生エラー:", err); }
        }

        async function handleFileSelect(event, type) {
            if (!directoryHandle) { alert("先に保存先フォルダを設定してください。"); return; }
            const file = event.target.files[0];
            if (!file) return;
            const instantBlobUrl = URL.createObjectURL(file);
            const now = new Date();
            const timestamp = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const savedFileName = `${currentTargetDate}_${Date.now()}_${file.name}`;
            activeBlobUrls[savedFileName] = instantBlobUrl;
            
            await saveMediaFileToFolder(file, savedFileName, type);
            diaryItems.push({ id: 'media-' + Date.now(), type: type, timestamp: timestamp, value: instantBlobUrl, fileName: file.name, externalName: savedFileName });
            sortAndRenderDiary(); await saveDiaryToFolder(); event.target.value = '';
        }

        function changeWeatherIcon(id) {
            const icons = ['<i class="fa-solid fa-sun text-amber-500"></i>', '<i class="fa-solid fa-cloud-sun text-blue-400"></i>', '<i class="fa-solid fa-cloud text-gray-400"></i>', '<i class="fa-solid fa-cloud-showers-heavy text-sky-500"></i>', '<i class="fa-solid fa-snowflake text-indigo-300"></i>'];
            const item = diaryItems.find(i => i.id === id);
            if (item) {
                let currentIdx = icons.findIndex(icon => icon === item.icon);
                let nextIdx = (currentIdx + 1) % icons.length;
                updateCalendarProp(id, 'icon', icons[nextIdx]);
                renderDiaryItems();
            }
        }

        function addDiaryItem(type) {
            if (!directoryHandle) { alert("先に保存先フォルダを設定してください。"); return; }
            if (isMonthlyListMode) { alert("月間表示モードでは追加できません。日付を選択してください。"); return; }
            
            const now = new Date();
            const timestamp = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            let newItem = { id: 'item-' + Date.now(), type: type, timestamp: timestamp };
            
            if (type === 'text') newItem.value = "";
            else if (type === 'calendar') { newItem.value = "新しいイベント"; newItem.location = ""; newItem.memo = ""; } 
            else if (type === 'weather') { newItem.value = "--°C"; newItem.location = "--°/--°"; newItem.memo = ""; newItem.icon = '<i class="fa-solid fa-cloud text-gray-400"></i>'; }

            diaryItems.push(newItem); sortAndRenderDiary(); saveDiaryToFolder();
        }

        function deleteItem(id) {
            if(!confirm("削除してもよろしいですか？（ファイルデータはフォルダ内に残ります）")) return;
            const idx = diaryItems.findIndex(i => i.id === id);
            if (idx !== -1) {
                const bDate = diaryItems[idx].belongingDate || currentTargetDate;
                if(fullMasterDatabase[bDate]) fullMasterDatabase[bDate] = fullMasterDatabase[bDate].filter(i => i.id !== id);
                diaryItems.splice(idx, 1); sortAndRenderDiary(); saveDiaryToFolder(false);
            }
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('image-lightbox'); const img = document.getElementById('lightbox-img');
            img.src = src; lightbox.classList.remove('hidden');
            setTimeout(() => { lightbox.classList.remove('opacity-0'); img.classList.remove('scale-95'); }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('image-lightbox'); const img = document.getElementById('lightbox-img');
            const container = document.getElementById('lightbox-scroll-container');
            lightbox.classList.add('opacity-0'); img.classList.add('scale-95');
            setTimeout(() => { 
                lightbox.classList.add('hidden'); img.src = ""; isOriginalSize = false;
                img.className = "max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform cursor-zoom-in";
                container.classList.add('items-center', 'justify-center');
                document.getElementById('zoom-indicator').innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> フィット';
            }, 300);
        }

        function scrollToTargetInput(element) {
            setTimeout(() => { element.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
        }

        let dragSrcElement = null;
        function enableDrag(handle) { handle.closest('.diary-card').setAttribute('draggable', 'true'); }
        function disableDrag(handle) { handle.closest('.diary-card').removeAttribute('draggable'); }
        
        function handleDragStart(e) { 
            if (isMonthlyListMode || isSearchingMode) { e.preventDefault(); return; }
            dragSrcElement = this; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; 
        }
        function handleDragOver(e) { if (e.preventDefault) e.preventDefault(); return false; }
        function handleDragEnd(e) { document.querySelectorAll('.diary-card').forEach(card => { card.classList.remove('dragging'); card.removeAttribute('draggable'); }); }
        
        function handleDrop(e) {
            e.stopPropagation(); e.preventDefault();
            if (isMonthlyListMode || isSearchingMode) return false;
            const targetCard = e.target.closest('.diary-card');
            if (targetCard && dragSrcElement !== targetCard) {
                const srcIndex = diaryItems.findIndex(item => item.id === dragSrcElement.getAttribute('data-id'));
                const targetIndex = diaryItems.findIndex(item => item.id === targetCard.getAttribute('data-id'));
                const temp = diaryItems[srcIndex];
                diaryItems.splice(srcIndex, 1); diaryItems.splice(targetIndex, 0, temp);
                renderDiaryItems(); saveDiaryToFolder();
            }
            return false;
        }

        let isOriginalSize = false;
        function toggleImageZoom(event) {
            event.stopPropagation();
            const img = document.getElementById('lightbox-img'); const container = document.getElementById('lightbox-scroll-container'); const indicator = document.getElementById('zoom-indicator');
            if (!isOriginalSize) {
                img.className = "w-auto h-auto max-w-none max-h-none cursor-zoom-out transition-all duration-300 transform";
                container.classList.remove('items-center', 'justify-center'); indicator.innerHTML = '<i class="fa-solid fa-magnifying-glass-minus"></i> 原寸大'; isOriginalSize = true;
            } else {
                img.className = "max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain transition-all duration-300 transform cursor-zoom-in";
                container.classList.add('items-center', 'justify-center'); indicator.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> フィット'; isOriginalSize = false;
            }
        }
    </script>
</body>
</html>
